services:
  - type: web
    name: for-testing-deployment-1
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn caller_backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONPATH
        value: caller_backend
