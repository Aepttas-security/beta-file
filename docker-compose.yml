version: '3.8'

# ========================================================
# DOCKER-COMPOSE MONOREPO TEMPLATE
# ========================================================
# Instructions for API Teams:
# Fill in your service configurations in your respective sections.
# Do not modify other teams' services.
# Replace any placeholders marked as <PLACEHOLDER_...> below.
# ========================================================

services:

  # ----------------------------------------------------
  # 1. parent-control Service
  # ----------------------------------------------------
  parent-control:
    container_name: security_parent_control
    build:
      context: ./backend/parent-control
      dockerfile: <PLACEHOLDER_PARENT_CONTROL_DOCKERFILE_PATH>
    # Build/run command:
    # command: <PLACEHOLDER_PARENT_CONTROL_RUN_COMMAND_E_G_uvicorn>
    ports:
      - "<PLACEHOLDER_PARENT_CONTROL_HOST_PORT>:<PLACEHOLDER_PARENT_CONTROL_CONTAINER_PORT>"
    environment:
      - <PLACEHOLDER_PARENT_CONTROL_ENV_VARIABLE_1>=<VALUE>
      - <PLACEHOLDER_PARENT_CONTROL_ENV_VARIABLE_2>=<VALUE>
    # Database/service dependencies:
    # depends_on:
    #   - <PLACEHOLDER_PARENT_CONTROL_DEPENDENCIES_E_G_db_or_redis>
    restart: always

  # ----------------------------------------------------
  # 2. call-management Service
  # ----------------------------------------------------
  call-management:
    container_name: security_call_management
    build:
      context: ./backend/call-management
      dockerfile: <PLACEHOLDER_CALL_MANAGEMENT_DOCKERFILE_PATH>
    # Build/run command:
    # command: <PLACEHOLDER_CALL_MANAGEMENT_RUN_COMMAND>
    ports:
      - "<PLACEHOLDER_CALL_MANAGEMENT_HOST_PORT>:<PLACEHOLDER_CALL_MANAGEMENT_CONTAINER_PORT>"
    environment:
      - <PLACEHOLDER_CALL_MANAGEMENT_ENV_VARIABLE_1>=<VALUE>
    # Database/service dependencies:
    # depends_on:
    #   - <PLACEHOLDER_CALL_MANAGEMENT_DEPENDENCIES>
    restart: always

  # ----------------------------------------------------
  # 3. vulnerability Service
  # ----------------------------------------------------
  vulnerability:
    container_name: security_vulnerability
    build:
      context: ./backend/vulnerability
      dockerfile: <PLACEHOLDER_VULNERABILITY_DOCKERFILE_PATH>
    # Build/run command:
    # command: <PLACEHOLDER_VULNERABILITY_RUN_COMMAND>
    ports:
      - "<PLACEHOLDER_VULNERABILITY_HOST_PORT>:<PLACEHOLDER_VULNERABILITY_CONTAINER_PORT>"
    environment:
      - <PLACEHOLDER_VULNERABILITY_ENV_VARIABLE_1>=<VALUE>
    # Database/service dependencies:
    # depends_on:
    #   - <PLACEHOLDER_VULNERABILITY_DEPENDENCIES>
    restart: always

  # ----------------------------------------------------
  # 4. geolocation Service
  # ----------------------------------------------------
  geolocation:
    container_name: security_geolocation
    build:
      context: ./backend/geolocation
      dockerfile: <PLACEHOLDER_GEOLOCATION_DOCKERFILE_PATH>
    # Build/run command:
    # command: <PLACEHOLDER_GEOLOCATION_RUN_COMMAND>
    ports:
      - "<PLACEHOLDER_GEOLOCATION_HOST_PORT>:<PLACEHOLDER_GEOLOCATION_CONTAINER_PORT>"
    environment:
      - <PLACEHOLDER_GEOLOCATION_ENV_VARIABLE_1>=<VALUE>
    # Database/service dependencies:
    # depends_on:
    #   - <PLACEHOLDER_GEOLOCATION_DEPENDENCIES>
    restart: always

  # ----------------------------------------------------
  # 5. malware Service
  # ----------------------------------------------------
  malware:
    container_name: security_malware
    build:
      context: ./backend/malware
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://apt_malware_app:intren%40_mal@100.112.49.39:5432/aepttas_xdr
      - DB_SCHEMA=apt
      - PORT=8001
    restart: always
